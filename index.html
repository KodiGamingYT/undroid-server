<!DOCTYPE html>
<html>
<head>
    <title>Un-Droid - Real Android Online</title>
    <style>
        body, html { margin: 0; padding: 0; background: black; width: 100vw; height: 100vh; overflow: hidden; font-family: sans-serif; touch-action: none; }
        
        #screen-container { 
            width: 100vw; 
            height: 100vh; 
            position: relative;
        }

        /* Ramka WebRTC VDO.ninja */
        iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
            pointer-events: none; /* Kindle może próbować klikać w wideo, blokujemy to */
        }

        /* Przezroczysta nakładka łapiąca każdy dotyk i kliknięcie */
        #mouse-capture-layer {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.01); /* Prawie przezroczyste, by przeglądarka łapała kliknięcia */
        }

        #lock-notice {
            position: absolute;
            top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #fff; padding: 8px 15px;
            border-radius: 20px; font-size: 13px; z-index: 10000; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="lock-notice">Tryb sterowania (Dotyk włączony / PC: Kliknij by zablokować mysz)</div>

    <div id="screen-container">
        <!-- Zmień ten link na SWÓJ WŁASNY link z VDO.ninja -->
        <iframe id="video-feed" src="https://vdo.ninja/?view=DtDPYut&autoplay=1&mute=1" allow="autoplay; picture-in-picture"></iframe>
        
        <div id="mouse-capture-layer" onmousedown="handleMouseDown(event)" onmouseup="handleMouseUp(event)"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="text/javascript">
        const socket = io(); 
        const captureLayer = document.getElementById('mouse-capture-layer');
        const notice = document.getElementById('lock-notice');

        // ==========================================
        // NOWE: OBSŁUGA EKRANÓW DOTYKOWYCH (KINDLE/SMARTFON)
        // ==========================================
        captureLayer.addEventListener('touchstart', (e) => {
            // Zapobiegamy przewijaniu strony na czytniku
            if (e.cancelable) e.preventDefault();
            
            let touch = e.touches[0];
            let rect = captureLayer.getBoundingClientRect();
            
            // Obliczamy współrzędne procentowe (od 0.0 do 1.0)
            let relX = (touch.clientX - rect.left) / rect.width;
            let relY = (touch.clientY - rect.top) / rect.height;
            
            // Wysyłamy zdarzenie "tap"
            socket.emit("tap_event", { x: relX, y: relY });
        }, { passive: false });


        // ==========================================
        // STARE: OBSŁUGA FIZYCZNEJ MYSZKI NA PC
        // ==========================================
        captureLayer.addEventListener('click', (e) => {
            // Aktywacja blokady tylko na PC (ignorowane przez dotyk)
            if (e.pointerType === "mouse") {
                captureLayer.requestPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === captureLayer) {
                notice.style.display = 'none';
                document.addEventListener("mousemove", handleMouseMove, false);
            } else {
                notice.style.display = 'block';
                document.removeEventListener("mousemove", handleMouseMove, false);
            }
        }, false);

        let accumX = 0; let accumY = 0; let sendTimeout = null;

        function handleMouseMove(e) {
            accumX += e.movementX; accumY += e.movementY;
            if (!sendTimeout) {
                sendTimeout = setTimeout(() => {
                    sendMouseEvent("move", accumX, accumY, 0);
                    accumX = 0; accumY = 0; sendTimeout = null;
                }, 15);
            }
        }

        function handleMouseDown(e) {
            if (document.pointerLockElement !== captureLayer) return;
            e.preventDefault(); sendMouseEvent("down", 0, 0, e.button);
        }

        function handleMouseUp(e) {
            if (document.pointerLockElement !== captureLayer) return;
            e.preventDefault(); sendMouseEvent("up", 0, 0, e.button);
        }

        window.addEventListener('contextmenu', e => e.preventDefault());

        function sendMouseEvent(action, dx, dy, button) {
            socket.emit("mouse_event", { action: action, dx: dx, dy: dy, button: button });
        }
    </script>
</body>
</html>
