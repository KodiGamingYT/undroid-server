<!DOCTYPE html>
<html>
<head>
    <title>Un-Droid - Smooth Swipe System</title>
    <style>
        body, html { margin: 0; padding: 0; background: black; width: 100vw; height: 100vh; overflow: hidden; }
        #phone-screen { width: 100vw; height: 100vh; position: relative; }
        img { width: 100%; height: 100%; object-fit: fill; cursor: grab; user-select: none; -webkit-user-drag: none; }
        img:active { cursor: grabbing; }
    </style>
    <script>
        let startX = 0;
        let startY = 0;

        // Płynne odświeżanie obrazu wideo
        setInterval(function() {
            var img = document.getElementById("live-stream-img");
            img.src = "/video_feed?t=" + new Date().getTime();
        }, 70);

        function getRelativeCoords(event, element) {
            var rect = element.getBoundingClientRect();
            var relativeX = (event.clientX - rect.left) / rect.width;
            var relativeY = (event.clientY - rect.top) / rect.height;
            return {
                x: Math.max(0, Math.min(1, relativeX)),
                y: Math.max(0, Math.min(1, relativeY))
            };
        }

        // 1. Zapamiętujemy początek dotknięcia ekranu
        function handleMouseDown(event) {
            var coords = getRelativeCoords(event, event.target);
            startX = coords.x;
            startY = coords.y;
        }

        // 2. W momencie puszczenia wysyłamy punkt STARTU i KONCA jednym, lekkim zapytaniem
        function handleMouseUp(event) {
            var coords = getRelativeCoords(event, event.target);
            
            var xhr = new XMLHttpRequest();
            // Wysyłamy współrzędne skąd dokąd użytkownik przeciągnął palec
            xhr.open("GET", "/click?x1=" + startX + "&y1=" + startY + "&x2=" + coords.x + "&y2=" + coords.y, true);
            xhr.send();
        }
    </script>
</head>
<body>

    <div id="phone-screen">
        <img id="live-stream-img" src="/video_feed" 
             onmousedown="handleMouseDown(event)" 
             onmouseup="handleMouseUp(event)">
    </div>

</body>
</html>
