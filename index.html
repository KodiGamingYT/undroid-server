<!DOCTYPE html>
<html>
<head>
    <title>Un-Droid - Hardware VNC System</title>
    <style>
        body, html { margin: 0; padding: 0; background: black; width: 100vw; height: 100vh; overflow: hidden; font-family: sans-serif; }
        
        /* Kontener na ekran VNC rozciągnięty na całą stronę */
        #vnc-canvas-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: fill;
        }
    </style>
    <!-- Ładowanie oficjalnego rdzenia noVNC z chmury CDN (Działa na Kindle!) -->
    <script type="module">
        import RFB from 'https://jsdelivr.net';

        let rfb;
        function connectVNC() {
            // Ponieważ darmowy Render nie ma stałego IP, łączymy się bezpośrednio 
            // z adresem Twojego domowego komputera przez protokół Websocket.
            // Zmień 'TWÓJ_DOMOWY_ADRES_IP' na Twoje publiczne IP (lub link z ngroka dla portu 8081)
            const host = "https://052b9d7b06bb96c8-93-159-12-2.serveousercontent.com"; 
            const port = "8081";
            const password = "1234"; // Twoje hasło ustawione w UltraVNC

            rfb = new RFB(document.getElementById('vnc-canvas-container'), `ws://${host}:${port}`, {
                credentials: { password: password }
            });

            // Automatyczne skalowanie obrazu pod ekran Kindle/PC
            rfb.scaleViewport = true;
            rfb.resizeSession = true;

            rfb.addEventListener("connect", () => {
                console.log("Połączono pomyślnie z telefonem przez VNC bez lagów!");
            });
        }

        window.addEventListener('load', connectVNC);
    </script>
</head>
<body>

    <!-- W tym miejscu noVNC automatycznie wygeneruje bezlagowy touchpad i wideo -->
    <div id="vnc-canvas-container"></div>

</body>
</html>
