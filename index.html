<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un-Droid - Hardware VNC Online System</title>
    <style>
        /* Rozciągamy widok na absolutnie 100% ekranu pod e-papier Kindle i PC */
        body, html { 
            margin: 0; 
            padding: 0; 
            background-color: #1a1a1a; 
            height: 100%; 
            width: 100vw;
            overflow: hidden; 
            font-family: sans-serif;
        }
        
        #vnc-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Wymuszamy, aby wygenerowany ekran z telefonu zajął całą stronę z zachowaniem proporcji */
        canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- W tym miejscu noVNC automatycznie wygeneruje bezlagowe wideo i touchpad -->
    <div id="vnc-container"></div>

    <!-- Ładowanie inteligentnej logiki sieciowej z pliku script.js -->
    <script type="module" src="script.js"></script>

</body>
</html>
