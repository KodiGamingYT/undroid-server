
        <!DOCTYPE html>
<html>
<head>
    <title>Un-Droid - Hardware Mouse System</title>
    <style>
        body, html { margin: 0; padding: 0; background: black; width: 100vw; height: 100vh; overflow: hidden; font-family: sans-serif; }
        
        #screen-container { 
            width: 100vw; 
            height: 100vh; 
            position: relative;
        }

        #twitch-embed {
            width: 100% !important;
            height: 100% !important;
        }

        #twitch-embed iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
        }

        /* Przezroczysta nakładka przechwytująca sprzętową mysz przed Twitchem */
        #mouse-capture-layer {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999;
            background: rgba(0, 0, 0, 0);
        }

        #lock-notice {
            position: absolute;
            top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #fff; padding: 8px 15px;
            border-radius: 20px; font-size: 13px; z-index: 10000; pointer-events: none;
        }
    </style>
    
    <!-- PAMIĘTAM: Dokładnie ten oficjalny skrypt osadzania od Twitcha -->
       <script src="https://embed.twitch.tv/embed/v1.js"></script>
</head>
<body>

    <div id="lock-notice">Kliknij na ekran, aby włączyć stream i zablokować mysz (ESC, aby wyjść)</div>

    <div id="screen-container">
        <div id="twitch-embed"></div>
        <!-- Warstwa przechwytująca ruchy przed ramką Twitcha -->
        <div id="mouse-capture-layer" onmousedown="handleMouseDown(event)" onmouseup="handleMouseUp(event)"></div>
    </div>

    <script type="text/javascript">
        const captureLayer = document.getElementById('mouse-capture-layer');
        const notice = document.getElementById('lock-notice');
        let twitchPlayerInstance = null;

        // Inicjalizacja oficjalnego obiektu Twitch.Embed z Twoim jawnym parentem Render
           new Twitch.Embed("twitch-embed", {
            width: "100%",
            height: "100%",
            channel: "undroid_project",
            parent: ["undroid-server.onrender.com"], // <--- Oczywiście pamiętam o jawnym parencie!
            layout: "video", // Ukrywa czat Twitcha i zostawia sam czysty obraz
            autoplay: true,
            muted: true
        });

        // Czekamy, aż Twitch wygeneruje player, żebyśmy mogli nim sterować z kodu JavaScript
        window.addEventListener('load', () => {
            setTimeout(() => {
                var iframe = document.querySelector('#twitch-embed iframe');
                if (iframe) {
                    twitchPlayerInstance = new Twitch.Player("twitch-embed");
                }
            }, 1000);
        });

        // 1. Aktywacja wideo + blokada kursora (Pointer Lock) po pierwszym kliknięciu
        captureLayer.addEventListener('click', () => {
            // Jeśli odtwarzacz Twitcha jest załadowany, siłą odpalamy wideo przez kod JS
            if (twitchPlayerInstance) {
                try {
                    twitchPlayerInstance.play();
                } catch(e) {
                    console.log("Twitch player play command failed, retrying...");
                }
            }
            
            // Włączamy blokadę myszy
            captureLayer.requestPointerLock();
        });

        // Śledzenie stanu blokady kursora
        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === captureLayer) {
                notice.style.display = 'none';
                document.addEventListener("mousemove", handleMouseMove, false);
            } else {
                notice.style.display = 'block';
                document.removeEventListener("mousemove", handleMouseMove, false);
            }
        }, false);

        // Liczniki bufora ruchu myszy, aby nie zapchać darmowego Rendera
        let accumX = 0;
        let accumY = 0;
        let sendTimeout = null;

        // 2. Przesyłanie przesunięcia myszy
        function handleMouseMove(e) {
            accumX += e.movementX;
            accumY += e.movementY;

            if (!sendTimeout) {
                sendTimeout = setTimeout(() => {
                    sendMouseEvent("move", accumX, accumY, 0);
                    accumX = 0;
                    accumY = 0;
                    sendTimeout = null;
                }, 15); // Wysyłanie paczek ruchu co 15ms zapewnia idealną płynność
            }
        }

        // 3. Przesyłanie wciśnięcia przycisku (Lewy = 0, Prawy = 2)
        function handleMouseDown(e) {
            if (document.pointerLockElement !== captureLayer) return;
            e.preventDefault();
            sendMouseEvent("down", 0, 0, e.button);
        }

        // 4. Przesyłanie puszczenia przycisku (Koniec kliknięcia lub koniec drag)
        function handleMouseUp(e) {
            if (document.pointerLockElement !== captureLayer) return;
            e.preventDefault();
            sendMouseEvent("up", 0, 0, e.button);
        }

        // Blokowanie systemowego menu kontekstowego Windowsa po kliknięciu prawym przyciskiem myszy
        window.addEventListener('contextmenu', e => e.preventDefault());

        function sendMouseEvent(action, dx, dy, button) {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", `/mouse_event?action=${action}&dx=${dx}&dy=${dy}&button=${button}`, true);
            xhr.send();
        }
    </script>
</body>
</html>
