<!DOCTYPE html>
<html>
<head>
    <title>Un-Droid</title>
    <style>
        body { margin: 0; padding: 0; background: black; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
        #phone-screen { height: 100vh; aspect-ratio: 9 / 16; background: #000; position: relative; }
        img { width: 100%; height: 100%; object-fit: contain; cursor: pointer; }
    </style>
    <script>
        // Błyskawiczne odświeżanie obrazu co 70ms bez obciążania procesora Kindle
        setInterval(function() {
            var img = document.getElementById("live-stream-img");
            img.src = "/video_feed?t=" + new Date().getTime();
        }, 70);

        function handleScreenClick(event) {
            var imageElement = document.getElementById("live-stream-img");
            var rect = imageElement.getBoundingClientRect();
            
            var relativeX = (event.clientX - rect.left) / rect.width;
            var relativeY = (event.clientY - rect.top) / rect.height;
            
            if (relativeX < 0 || relativeX > 1 || relativeY < 0 || relativeY > 1) return;
            
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "/click?x=" + relativeX + "&y=" + relativeY, true);
            xhr.send();
        }
    </script>
</head>
<body>

    <div id="phone-screen">
        <img id="live-stream-img" src="/video_feed" onclick="handleScreenClick(event)">
    </div>

</body>
</html>
