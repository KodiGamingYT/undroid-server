<!DOCTYPE html>
<html>
<head>
    <title>Un-Droid - H.264 Touchpad System</title>
    <style>
        body, html { margin: 0; padding: 0; background: black; width: 100vw; height: 100vh; overflow: hidden; font-family: sans-serif; }
        
        #screen-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
        }

        /* 1. Odtwarzacz MP4/H.264 na pełny ekran z pełną płynnością FPS */
        video { 
            width: 100%; 
            height: 100%; 
            object-fit: fill; 
            pointer-events: none; /* Ukrywa domyślne menu wideo przeglądarki */
        }

        /* 2. Twój pomysł: Niewidzialny wirtualny touchpad na całą stronę */
        #touch-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 999; 
            cursor: crosshair; 
            background: rgba(0,0,0,0); /* W pełni przezroczysta warstwa łapiąca dotyk */
        }
    </style>
    <script>
        function handleTouchpadClick(event) {
            var overlay = document.getElementById("touch-overlay");
            var rect = overlay.getBoundingClientRect();
            
            // Pobieranie współrzędnych z wirtualnego touchpada na pełnym ekranie
            var relativeX = (event.clientX - rect.left) / rect.width;
            var relativeY = (event.clientY - rect.top) / rect.height;
            
            // Wysłanie współrzędnych do serwera Render
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "/click?x=" + relativeX + "&y=" + relativeY, true);
            xhr.send();
        }
    </script>
</head>
<body>

    <div id="screen-container">
        <!-- Płynny odtwarzacz wideo w chmurze H.264 -->
        <video autoplay muted playsinline id="live-video">
            <source src="/video_stream" type="video/mp4">
        </video>
        
        <!-- Niewidzialna nakładka dotykowa na całą stronę -->
        <div id="touch-overlay" onclick="handleTouchpadClick(event)"></div>
    </div>

</body>
</html>
