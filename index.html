<!DOCTYPE html>
<html>
<head>
    <title>Un-Droid</title>
    <style>
        /* Rozciągamy widok na absolutnie 100% ekranu bez marginesów */
        body, html { margin: 0; padding: 0; background: black; width: 100vw; height: 100vh; overflow: hidden; font-family: sans-serif; }
        
        #screen-container { 
            width: 100vw; 
            height: 100vh; 
            position: relative;
        }

        /* Twój iframe rozciągnięty na 100% szerokości i wysokości strony z działającym playerem */
        iframe { 
            width: 100% !important; 
            height: 100% !important; 
            border: none;
        }
    </style>
    <script>
        function handleScreenClick(event) {
            var iframeElement = document.getElementById("twitch-player");
            var rect = iframeElement.getBoundingClientRect();
            
            // Pobieranie współrzędnych procentowych bezpośrednio z obszaru odtwarzacza
            var relativeX = (event.clientX - rect.left) / rect.width;
            var relativeY = (event.clientY - rect.top) / rect.height;
            
            // Natychmiastowe wysłanie kliknięcia do serwera Render
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "/click?x=" + relativeX + "&y=" + relativeY, true);
            xhr.send();
        }
    </script>
</head>
<body>

    <div id="screen-container" onclick="handleScreenClick(event)">
  
        <iframe id="twitch-player" src="https://player.twitch.tv/?channel=undroid_project&parent=www.onrender.com" frameborder="0" allowfullscreen="true" scrolling="no" height="378" width="620"></iframe>
    </div>

</body>
</html>
