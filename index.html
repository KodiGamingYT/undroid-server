<!DOCTYPE html>
<html>
<head>
    <title>Un-Droid - Hardware VNC Online System</title>
    <style>
        body, html { margin: 0; padding: 0; background: black; width: 100vw; height: 100vh; overflow: hidden; font-family: sans-serif; }
        
        #vnc-canvas-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: fill;
        }
    </style>
    <!-- Ładowanie oficjalnego rdzenia noVNC z chmury CDN -->
    <script type="module">
        import RFB from 'https://jsdelivr.net';

        let rfb;
        function connectVNC() {
            // TUTAJ: Wklejasz swój dokładny link HTTPS wygenerowany przez Pinggy z Kroku 1!
            const tunnelUrl = "https://cvvwt-93-159-12-2.free.pinggy.net"; 
            
            // Zamiana na bezpieczny, w 100% szyfrowany online protokół wss://
            const wsUrl = tunnelUrl.replace("https://", "wss://");
            const password = "1234"; // Twoje hasło z UltraVNC

            rfb = new RFB(document.getElementById('vnc-canvas-container'), wsUrl, {
                credentials: { password: password }
            });

            // Automatyczne skalowanie obrazu pod ekrany mobilne, PC i Kindle
            rfb.scaleViewport = true;
            rfb.resizeSession = true;

            rfb.addEventListener("connect", () => {
                console.log("Sukces! Połączono online przez bezpieczny tunel!");
            });
        }

        window.addEventListener('load', connectVNC);
    </script>
</head>
<body>

    <!-- Miejsce na bezlagowy, szyfrowany obraz z telefonu -->
    <div id="vnc-canvas-container"></div>

</body>
</html>
