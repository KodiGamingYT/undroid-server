<!DOCTYPE html>
<html>
<head>
    <title>Un-Droid - Cloud Platform</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        body, html { margin: 0; padding: 0; background: #111; color: white; font-family: sans-serif; height: 100vh; overflow: hidden; touch-action: none; }
        
        #lobby { position: absolute; top:0; left:0; width:100%; height:100%; background: #111; display: flex; flex-direction: column; align-items: center; padding-top: 5vh; z-index: 20000; overflow-y: auto; }
        .vm-card { background: #222; padding: 15px; margin: 10px; border-radius: 8px; width: 90%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #444; }
        .vm-card button { background: #4CAF50; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .vm-card button:disabled { background: #555; cursor: not-allowed; }
        
        #app-ui { display: none; height: 100vh; width: 100vw; flex-direction: column; position: relative; }
        #btn-exit { position: absolute; top: 10px; left: 10px; z-index: 10001; background: #e74c3c; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        #video-container { height: 40vh; width: 100vw; position: relative; background: #000; border-bottom: 3px solid #333; transition: height 0.3s; display: flex; justify-content: center; align-items: center;}
        
        iframe { position: absolute; width: 100%; height: 100%; border: none; pointer-events: none; }
        
        /* 
           NOWE PODEJŚCIE: Warstwa dotykowa ma proporcje 9:16 (jak Twój emulator)
           Będzie się idealnie pokrywać z wideo z VDO.ninja, ignorując czarne pasy!
        */
        #touchscreen-layer { 
            display: none; 
            position: relative; 
            aspect-ratio: 9 / 16; 
            max-width: 100%; 
            max-height: 100%; 
            width: 100%; /* Elastyczne skalowanie */
            z-index: 10; 
            /* background: rgba(255, 0, 0, 0.2); ODKOMENTUJ TĘ LINIĘ ABY ZOBACZYĆ STREFĘ DOTYKU (NA CZERWONO) */
        }
        
        #mouse-capture-layer { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; cursor: crosshair; }

        #controls-container { height: 60vh; width: 100vw; display: flex; flex-direction: column; background: #222; padding: 10px; box-sizing: border-box; }
        .buttons-row { display: flex; height: 25%; width: 100%; gap: 10px; margin-bottom: 10px; }
        .btn { flex: 1; background: #444; border: 2px solid #555; border-radius: 10px; display: flex; align-items: center; justify-content: center; user-select: none; }
        #touchpad { flex: 1; background: #333; border: 2px dashed #666; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; }

        body.fullscreen-mode #controls-container { display: none !important; }
        body.fullscreen-mode #video-container { height: 100vh !important; border-bottom: none; }
        
        #pc-notice { display: none; position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 8px 15px; border-radius: 20px; font-size: 13px; z-index: 10000; pointer-events: none; }
    </style>
</head>
<body>
    <div id="lobby">
        <h1 style="color:#4CAF50;">Un-Droid Cloud</h1>
        <div id="vm-list">Loading...</div>
    </div>

    <div id="app-ui">
        <button id="btn-exit" onclick="leaveVM()">Exit</button>
        <div id="pc-notice">Click anywhere to control (Press ESC to unlock)</div>
        
        <div id="video-container">
            <iframe id="video-feed" src="" allow="autoplay; picture-in-picture"></iframe>
            <!-- Wyśrodkowana strefa dopasowana pod Emulator -->
            <div id="touchscreen-layer"></div>
            <div id="mouse-capture-layer"></div>
        </div>
        
        <div id="controls-container">
            <div class="buttons-row"><div id="btn-left" class="btn">Left Click</div><div id="btn-right" class="btn">Right Click</div></div>
            <div id="touchpad"><p>TOUCHPAD</p></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const isMobileOrTablet = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || ('ontouchstart' in window && window.innerWidth <= 1024);

        socket.on('vm_list', (vms) => {
            if (vms.length === 0) {
                document.getElementById('vm-list').innerHTML = `
                    <div style="background: #222; padding: 25px; border-radius: 8px; text-align: center; border: 1px dashed #555;">
                        <h3 style="color: #aaa;">No active machines</h3>
                        <p style="color: #777; font-size: 14px;">All virtual machines are currently offline.</p>
                    </div>`;
                return;
            }

            document.getElementById('vm-list').innerHTML = vms.map(vm => `
                <div class="vm-card">
                    <div><b>${vm.name}</b><br><small>${vm.os.toUpperCase()} | ${vm.is_occupied ? 'In Use' : 'Available'}</small></div>
                    <button ${vm.is_occupied ? 'disabled' : ''} onclick="joinVM('${vm.id}')">Play</button>
                </div>
            `).join('');
        });

        function joinVM(id) { socket.emit('join_vm', id); }
        
        function leaveVM() { 
            socket.emit('leave_vm'); 
            document.getElementById('app-ui').style.display='none'; 
            document.getElementById('lobby').style.display='flex'; 
            document.getElementById('video-feed').src=""; 
            document.body.classList.remove('fullscreen-mode'); 
            document.getElementById('pc-notice').style.display = 'none';
        }

        socket.on('join_success', (data) => {
            document.getElementById('lobby').style.display = 'none';
            document.getElementById('app-ui').style.display = 'flex';
            document.getElementById('video-feed').src = data.video_url;

            if (data.os === 'android') {
                document.body.classList.add('fullscreen-mode');
                document.getElementById('touchscreen-layer').style.display = 'block';
                document.getElementById('mouse-capture-layer').style.display = 'none';
                document.getElementById('pc-notice').style.display = 'none';
            } else {
                document.getElementById('touchscreen-layer').style.display = 'none';
                
                if (!isMobileOrTablet) {
                    document.body.classList.add('fullscreen-mode');
                    document.getElementById('mouse-capture-layer').style.display = 'block';
                    document.getElementById('pc-notice').style.display = 'block';
                } else {
                    document.getElementById('mouse-capture-layer').style.display = 'none';
                    document.getElementById('pc-notice').style.display = 'none';
                }
            }
        });

        const touchLayer = document.getElementById('touchscreen-layer');
        touchLayer.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = touchLayer.getBoundingClientRect();
            const touch = e.touches[0];
            const relX = (touch.clientX - rect.left) / rect.width;
            const relY = (touch.clientY - rect.top) / rect.height;
            socket.emit('absolute_input', { action: 'tap', x: relX, y: relY });
        }, {passive: false});
        
        touchLayer.addEventListener('mousedown', (e) => {
            e.preventDefault();
            const rect = touchLayer.getBoundingClientRect();
            const relX = (e.clientX - rect.left) / rect.width;
            const relY = (e.clientY - rect.top) / rect.height;
            socket.emit('absolute_input', { action: 'tap', x: relX, y: relY });
        });

        let accumX = 0, accumY = 0, sendTimeout = null;
        function sendBufferedMove(dx, dy) {
            accumX += dx; accumY += dy;
            if (!sendTimeout) {
                sendTimeout = setTimeout(() => { socket.emit("mouse_event", { action: "move", dx: Math.round(accumX), dy: Math.round(accumY), button: 0 }); accumX = 0; accumY = 0; sendTimeout = null; }, 25); 
            }
        }
        
        const touchpad = document.getElementById('touchpad');
        let lastX = null, lastY = null;
        touchpad.addEventListener('touchstart', e => { e.preventDefault(); lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }, {passive: false});
        touchpad.addEventListener('touchmove', e => {
            e.preventDefault(); if (!lastX) return;
            let cx = e.touches[0].clientX, cy = e.touches[0].clientY;
            sendBufferedMove((cx - lastX) * 1.5, (cy - lastY) * 1.5);
            lastX = cx; lastY = cy;
        }, {passive: false});
        touchpad.addEventListener('touchend', e => { e.preventDefault(); lastX = null; }, {passive: false});

        document.getElementById('btn-left').addEventListener('touchstart', e => { e.preventDefault(); socket.emit("mouse_event", { action: "down", button: 0 }); });
        document.getElementById('btn-left').addEventListener('touchend', e => { e.preventDefault(); socket.emit("mouse_event", { action: "up", button: 0 }); });

        const captureLayer = document.getElementById('mouse-capture-layer');
        const pcNotice = document.getElementById('pc-notice');
        
        captureLayer.addEventListener('click', (e) => {
            if (e.pointerType === "mouse" || !isMobileOrTablet) captureLayer.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === captureLayer) {
                pcNotice.style.display = 'none'; 
                document.addEventListener("mousemove", pcMouseMove, false);
            } else {
                if (!isMobileOrTablet && document.getElementById('app-ui').style.display !== 'none') pcNotice.style.display = 'block'; 
                document.removeEventListener("mousemove", pcMouseMove, false);
            }
        }, false);

        function pcMouseMove(e) { sendBufferedMove(e.movementX, e.movementY); }
        
        captureLayer.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement === captureLayer) socket.emit("mouse_event", { action: "down", dx: 0, dy: 0, button: e.button });
        });
        captureLayer.addEventListener('mouseup', (e) => {
            if (document.pointerLockElement === captureLayer) socket.emit("mouse_event", { action: "up", dx: 0, dy: 0, button: e.button });
        });
        
        captureLayer.addEventListener('wheel', (e) => {
            if (document.pointerLockElement === captureLayer) {
                e.preventDefault();
                let scrollDir = e.deltaY > 0 ? -1 : 1;
                socket.emit("mouse_event", { action: "scroll", dx: 0, dy: scrollDir, button: 0 });
            }
        }, { passive: false });

        const blockedKeys = ['Control', 'Alt', 'Shift', 'Meta', 'Tab', 'Insert', 'PrintScreen', 'Escape', 'OS'];
        function isKeyAllowed(key) {
            if (blockedKeys.includes(key)) return false;
            if (/^F(1[0-2]|[1-9])$/.test(key)) return false;
            return true;
        }

        document.addEventListener('keydown', (e) => {
            if (document.pointerLockElement !== captureLayer) return;
            if (e.repeat) return; 
            if (e.key !== 'Escape') e.preventDefault(); 
            socket.emit('key_event', { action: 'down', key: e.key });
        });
        
        document.addEventListener('keyup', (e) => {
            if (document.pointerLockElement !== captureLayer) return;
            if (e.key !== 'Escape') e.preventDefault();
            socket.emit('key_event', { action: 'up', key: e.key });
        });
    </script>
</body>
</html>
