<!DOCTYPE html>
<html>
<head>
    <title>Un-Droid - Dynamic Embed System</title>
    <style>
        /* Rozciągamy widok na absolutnie 100% ekranu bez marginesów */
        body, html { margin: 0; padding: 0; background: black; width: 100vw; height: 100vh; overflow: hidden; font-family: sans-serif; }
        
        #screen-container { 
            width: 100vw; 
            height: 100vh; 
            position: relative;
        }

        /* Ramka ładująca gotowy generator bez błędów misconfigured */
        iframe { 
            width: 100% !important; 
            height: 100% !important; 
            border: none;
        }
    </style>
    <script>
        function handleScreenClick(event) {
            var iframeElement = document.getElementById("twitch-player");
            var rect = iframeElement.getBoundingClientRect();
            
            // Pobieranie współrzędnych procentowych z kliknięcia
            var relativeX = (event.clientX - rect.left) / rect.width;
            var relativeY = (event.clientY - rect.top) / rect.height;
            
            // Natychmiastowe wysłanie sygnału dotyku do serwera Render
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "/click?x=" + relativeX + "&y=" + relativeY, true);
            xhr.send();
        }
    </script>
</head>
<body>

    <div id="screen-container" onclick="handleScreenClick(event)">
        <!-- OSADZENIE GENERATORA: Czysty link, który bez problemu odpala stream na każdym urządzeniu -->
        <iframe id="twitch-player" src="https://adiru3.github.io/Twitch-Embed-Generator/?channel=undroid_project" frameborder="0" allowfullscreen="true" scrolling="no"></iframe>
    </div>

</body>
</html>
