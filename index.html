<!DOCTYPE html>
<html>
<head>
    <title>Un-Droid - Hardware Mouse System</title>
    <style>
        body, html { margin: 0; padding: 0; background: black; width: 100vw; height: 100vh; overflow: hidden; font-family: sans-serif; }
        
        #screen-container { 
            width: 100vw; 
            height: 100vh; 
            position: relative;
        }

        #twitch-embed {
            width: 100% !important;
            height: 100% !important;
        }

        #twitch-embed iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
        }

        /* Przezroczysta nakładka przechwytująca sprzętową mysz przed Twitchem */
        #mouse-capture-layer {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999;
            background: rgba(0, 0, 0, 0);
        }

        #lock-notice {
            position: absolute;
            top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: #fff; padding: 8px 15px;
            border-radius: 20px; font-size: 13px; z-index: 10000; pointer-events: none;
        }
    </style>
    
    <!-- PAMIĘTAM: Dokładnie ten oficjalny skrypt osadzania od Twitcha -->
    <script src="https://embed.twitch.tv/embed/v1.js"></script>
</head>
<body>

    <div id="lock-notice">Kliknij na ekran, aby zablokować mysz i przejąć kontrolę (ESC, aby wyjść)</div>

    <div id="screen-container">
        <div id="twitch-embed"></div>
        <!-- Warstwa przechwytująca ruchy przed ramką Twitcha -->
        <div id="mouse-capture-layer" onmousedown="handleMouseDown(event)" onmouseup="handleMouseUp(event)"></div>
    </div>

    <script type="text/javascript">
        const captureLayer = document.getElementById('mouse-capture-layer');
        const notice = document.getElementById('lock-notice');

        // Inicjalizacja oficjalnego obiektu Twitch.Embed z Twoim jawnym parentem Render
        new Twitch.Embed("twitch-embed", {
            width: "100%",
            height: "100%",
            channel: "undroid_project",
            parent: ["://onrender.com"], // <--- Oczywiście pamiętam o jawnym parencie!
            layout: "video", // Ukrywa czat Twitcha i zostawia sam czysty obraz
            autoplay: true,
            muted: true
        });

        // 1. Aktywacja blokady kursora (Pointer Lock) po kliknięciu na stronę
        captureLayer.addEventListener('click', () => {
            captureLayer.requestPointerLock();
        });

        // Śledzenie stanu blokady kursora
        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === captureLayer) {
                notice.style.display = 'none';
                document.addEventListener("mousemove", handleMouseMove, false);
            } else {
                notice.style.display = 'block';
                document.removeEventListener("mousemove", handleMouseMove, false);
            }
        }, false);

        // 2. Przesyłanie względnego przesunięcia myszy (ruch dx, dy)
        function handleMouseMove(e) {
            sendMouseEvent("move", e.movementX, e.movementY, 0);
        }

        // 3. Przesyłanie wciśnięcia przycisku (Lewy = 0, Prawy = 2)
        function handleMouseDown(e) {
            if (document.pointerLockElement !== captureLayer) return;
            e.preventDefault();
            sendMouseEvent("down", 0, 0, e.button);
        }

        // 4. Przesyłanie puszczenia przycisku (Koniec kliknięcia lub koniec drag)
        function handleMouseUp(e) {
            if (document.pointerLockElement !== captureLayer) return;
            e.preventDefault();
            sendMouseEvent("up", 0, 0, e.button);
        }

        // Blokowanie wyskakiwania domyślnego menu Windowsa po kliknięciu prawym przyciskiem myszy
        window.addEventListener('contextmenu', e => e.preventDefault());

        function sendMouseEvent(action, dx, dy, button) {
            var xhr = new XMLHttpRequest();
            xhr.open("GET", `/mouse_event?action=${action}&dx=${dx}&dy=${dy}&button=${button}`, true);
            xhr.send();
        }
    </script>
</body>
</html>
