<!DOCTYPE html>
<html>
<head>
    <title>Un-Droid - Official Twitch Embed System</title>
    <style>
        /* Rozciągamy widok na absolutnie 100% ekranu bez marginesów i pasków przewijania */
        body, html { margin: 0; padding: 0; background: black; width: 100vw; height: 100vh; overflow: hidden; font-family: sans-serif; }
        
        #screen-container { 
            width: 100vw; 
            height: 100vh; 
            position: relative;
        }

        /* Wymuszamy, aby wygenerowany przez Twitcha odtwarzacz zajął cały ekran */
        #twitch-embed {
            width: 100% !important;
            height: 100% !important;
        }

        #twitch-embed iframe {
            width: 100% !important;
            height: 100% !important;
            border: none;
        }
    </style>
    
    <!-- 1. Ładowanie oficjalnego skryptu integracyjnego, który wkleiłeś -->
    <script src="https://embed.twitch.tv/embed/v1.js"></script>
</head>
<body>

    <!-- 2. Twój kontener na odtwarzacz wideo z wbudowaną funkcją łapania kliknięć i przeciągnięć -->
    <div id="screen-container" onmousedown="saveStartPos(event)" onmouseup="handleScreenClick(event)">
        <div id="twitch-embed"></div>
    </div>

    <script type="text/javascript">
        // Zmienne do przechowywania punktu startowego gestu touchpadu
        let startX = 0;
        let startY = 0;

        // Zapamiętujemy miejsce wciśnięcia myszki/palca na ekranie
        function saveStartPos(event) {
            var embedContainer = document.getElementById("twitch-embed");
            var rect = embedContainer.getBoundingClientRect();
            startX = (event.clientX - rect.left) / rect.width;
            startY = (event.clientY - rect.top) / rect.height;
        }

        // 3. Inicjalizacja oficjalnego obiektu Twitch.Embed z Twoimi parametrami
        new Twitch.Embed("twitch-embed", {
            width: "100%",
            height: "100%",
            channel: "undroid_project",
            parent: ["undroid-server.onrender.com"], // <--- Jawnym parentem staje się Twój Render
            layout: "video", // "video" całkowicie wyłącza czat Twitcha i zostawia sam czysty obraz!
            autoplay: true,
            muted: true
        });

        // Twoja główna funkcja - teraz rozbudowana o przekazywanie wektora ruchu dla swipe!
        function handleScreenClick(event) {
            var embedContainer = document.getElementById("twitch-embed");
            var rect = embedContainer.getBoundingClientRect();
            
            // Pobieranie ultra-precyzyjnych współrzędnych procentowych z puszczenia ekranu (Koniec gestu)
            var endX = (event.clientX - rect.left) / rect.width;
            var endY = (event.clientY - rect.top) / rect.height;
            
            // Ograniczenie wartości w przedziale bezpiecznym 0.0 - 1.0
            endX = Math.max(0, Math.min(1, endX));
            endY = Math.max(0, Math.min(1, endY));
            
            // Tworzymy adres URL przesyłający punkt STARTU (x1, y1) oraz KONCA (x2, y2)
            // Dzięki temu Python na komputerze sam zdecyduje czy zrobić kliknięcie, czy płynny swipe!
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "/click?x1=" + startX + "&y1=" + startY + "&x2=" + endX + "&y2=" + endY, true);
            xhr.send();
        }
    </script>
</body>
</html>
