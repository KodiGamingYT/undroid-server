<!DOCTYPE html>
<html>
<head>
    <title>Un-Droid - Constant Stream System</title>
    <style>
        body, html { margin: 0; padding: 0; background: black; width: 100vw; height: 100vh; overflow: hidden; }
        #phone-screen { width: 100vw; height: 100vh; position: relative; }
        img { width: 100%; height: 100%; object-fit: fill; cursor: pointer; user-select: none; -webkit-user-drag: none; }
    </style>
    <script>
        function handleScreenClick(event) {
            var imageElement = document.getElementById("live-stream-img");
            var rect = imageElement.getBoundingClientRect();
            
            var relativeX = (event.clientX - rect.left) / rect.width;
            var relativeY = (event.clientY - rect.top) / rect.height;
            
            if (relativeX < 0 || relativeX > 1 || relativeY < 0 || relativeY > 1) return;
            
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "/click?x=" + relativeX + "&y=" + relativeY, true);
            xhr.send();
        }
    </script>
</head>
<body>

    <div id="phone-screen">
        <!-- Przeglądarka połączy się raz i sama będzie płynnie dekodować film w locie -->
        <img id="live-stream-img" src="/video_feed" onclick="handleScreenClick(event)">
    </div>

</body>
</html>
