<!DOCTYPE html>
<html>
<head>
    <title>Un-Droid - WebP Touchpad System</title>
    <style>
        body, html { margin: 0; padding: 0; background: black; width: 100vw; height: 100vh; overflow: hidden; }
        
        #screen-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
        }

        /* Obraz WebP rozciągnięty na całą stronę */
        img { 
            width: 100%; 
            height: 100%; 
            object-fit: fill; 
            pointer-events: none; 
        }

        /* Niewidzialna nakładka dotykowa na całą stronę */
        #touch-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 999; 
            cursor: crosshair; 
            background: rgba(0,0,0,0); 
        }
    </style>
    <script>
        // Samodzielne, błyskawiczne pobieranie klatki co 45ms (Bezpieczne dla telefonów i Kindle)
        setInterval(function() {
            var img = document.getElementById("live-stream-img");
            // Dodajemy unikalny timestamp, żeby przeglądarka nie pobierała obrazka z pamięci podręcznej (Cache)
            img.src = "/get_frame?t=" + new Date().getTime();
        }, 45);

        function handleTouchpadClick(event) {
            var overlay = document.getElementById("touch-overlay");
            var rect = overlay.getBoundingClientRect();
            
            var relativeX = (event.clientX - rect.left) / rect.width;
            var relativeY = (event.clientY - rect.top) / rect.height;
            
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "/click?x=" + relativeX + "&y=" + relativeY, true);
            xhr.send();
        }
    </script>
</head>
<body>

    <div id="screen-container">
        <!-- Obraz pobierany asynchronicznie przez JS -->
        <img id="live-stream-img" src="/get_frame">
        
        <!-- Niewidzialny touchpad na wierzchu -->
        <div id="touch-overlay" onclick="handleTouchpadClick(event)"></div>
    </div>

</body>
</html>
