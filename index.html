<!DOCTYPE html>
<html>
<head>
    <title>Un-Droid - WebP Touchpad System</title>
    <style>
        body, html { margin: 0; padding: 0; background: black; width: 100vw; height: 100vh; overflow: hidden; }
        
        #screen-container { 
            position: relative; 
            width: 100vw; 
            height: 100vh; 
        }

        /* Obraz WebP na pełny ekran */
        img { 
            width: 100%; 
            height: 100%; 
            object-fit: fill; 
            pointer-events: none; /* Ignoruje domyślne przeciąganie przeglądarki */
        }

        /* Niewidzialny, wirtualny touchpad nałożony na całą stronę */
        #touch-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh; 
            z-index: 999; 
            cursor: crosshair; 
            background: rgba(0,0,0,0); 
        }
    </style>
    <script>
        function handleTouchpadClick(event) {
            var overlay = document.getElementById("touch-overlay");
            var rect = overlay.getBoundingClientRect();
            
            var relativeX = (event.clientX - rect.left) / rect.width;
            var relativeY = (event.clientY - rect.top) / rect.height;
            
            var xhr = new XMLHttpRequest();
            xhr.open("GET", "/click?x=" + relativeX + "&y=" + relativeY, true);
            xhr.send();
        }
    </script>
</head>
<body>

    <div id="screen-container">
        <!-- Ultra lekki strumień obrazków WebP od Google -->
        <img id="live-stream-img" src="/video_feed">
        
        <!-- Twój niewidzialny touchpad na wierzchu -->
        <div id="touch-overlay" onclick="handleTouchpadClick(event)"></div>
    </div>

</body>
</html>
